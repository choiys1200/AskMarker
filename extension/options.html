<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AskMarker · 아이콘 선택</title>
  <link rel="icon" href="../assets/icons/markchat-32.png" type="image/png">
  <link rel="stylesheet" href="options.css">
  <script type="module" src="options.js"></script>
</head>
<body>
  <main>
    <header><img src="../assets/icons/markchat-128.png" width="48" height="48" alt=""><div><p class="eyebrow">ASKMARKER <span id="version"></span></p><h1>아이콘 선택</h1></div></header>
    <p class="intro">마음에 드는 아이콘을 고르세요. Chrome 도구 모음에 바로 적용됩니다.</p>
    <section class="preview" aria-label="선택한 아이콘 미리보기">
      <div class="hero"><img id="preview-icon" src="../assets/icons/markchat-256.png" alt="MarkChat 아이콘" width="128" height="128"></div>
      <div><p class="eyebrow">선택한 아이콘</p><h2 id="preview-name">MarkChat</h2><p id="preview-description">말풍선 + 형광펜. 표시한 문장에서 질문 시작</p><div class="size-previews" aria-label="밝고 어두운 배경의 실제 크기"><span class="sample light"><img data-sample="16" width="16" height="16" alt="밝은 배경 16px"><img data-sample="32" width="32" height="32" alt="밝은 배경 32px"></span><span class="sample dark"><img data-sample="16" width="16" height="16" alt="어두운 배경 16px"><img data-sample="32" width="32" height="32" alt="어두운 배경 32px"></span><span class="sizes">16 / 32 px</span></div></div>
    </section>
    <fieldset id="choices" disabled><legend>아이콘 선택</legend><div id="icon-grid"></div></fieldset>
    <p id="status" role="status" aria-live="polite">설정을 불러오는 중입니다.</p>
    <button id="retry" hidden>다시 불러오기</button>
    <footer><p>선택은 이 브라우저에 저장됩니다. 질문 기록과 읽기 설정은 그대로 유지됩니다.</p><p>아이콘이 안 보이면 Chrome의 퍼즐 모양 메뉴에서 AskMarker를 고정하세요.</p><p class="fine">확장 프로그램 관리 화면과 설치 화면에는 기본 MarkChat 아이콘이 표시됩니다.</p></footer>
  </main>
</body>
</html>
